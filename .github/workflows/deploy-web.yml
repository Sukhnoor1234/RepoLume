name: Deploy public demo

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Optional public URL to smoke test after deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repolume-public-demo
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build and test public demo
        run: npm test

      - name: Deploy web worker
        run: npm run deploy:worker

      - name: Smoke test public URL
        if: ${{ inputs.deployment_url != '' }}
        run: npm run smoke -- "${{ inputs.deployment_url }}"
