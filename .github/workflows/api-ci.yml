name: API checks

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docs/api/**"
      - "docs/decisions/**"
      - "docs/security/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "docs/api/**"
      - "docs/decisions/**"
      - "docs/security/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    env:
      REPOLUME_DATABASE_URL: postgresql+psycopg://repolume_test:repolume_test@localhost:5432/repolume_test
      REPOLUME_TEST_DATABASE_URL: postgresql+psycopg://repolume_test:repolume_test@localhost:5432/repolume_test
      REPOLUME_TEST_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: repolume_test
          POSTGRES_PASSWORD: repolume_test
          POSTGRES_USER: repolume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolume_test -d repolume_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Check model and migration drift
        run: python -m alembic check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Test Redis integration
        run: python -m pytest -m integration
