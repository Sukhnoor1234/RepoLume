name: Worker checks

on:
  pull_request:
    paths:
      - "apps/worker/**"
      - "docs/decisions/**"
      - "docs/worker/**"
      - "docs/security/**"
      - ".github/workflows/worker-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/worker/**"
      - "docs/decisions/**"
      - "docs/worker/**"
      - "docs/security/**"
      - ".github/workflows/worker-ci.yml"

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    env:
      REPOLUME_TEST_REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Test Redis integration
        run: python -m pytest -m integration

      - name: Check worker readiness
        run: python -m repolume_worker --check
