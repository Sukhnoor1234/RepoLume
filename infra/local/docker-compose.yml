services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: repolume
      POSTGRES_USER: repolume
      POSTGRES_PASSWORD: repolume_dev_password
    ports:
      - "5432:5432"
    volumes:
      - repolume-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolume -d repolume"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8.1
    ports:
      - "6379:6379"
    volumes:
      - repolume-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  repolume-postgres-data:
  repolume-redis-data:
