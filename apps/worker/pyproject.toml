[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repolume-worker"
version = "0.1.0"
description = "Analysis worker for RepoLume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx2==2.9.1",
  "redis==8.0.1",
  "tree-sitter==0.26.0",
  "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[project.scripts]
repolume-worker = "repolume_worker.cli:entrypoint"

[tool.pytest.ini_options]
addopts = '-q -m "not integration"'
testpaths = ["tests"]
markers = [
  "integration: requires a live Redis service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
