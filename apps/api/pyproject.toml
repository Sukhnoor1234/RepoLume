[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repolume-api"
version = "0.1.0"
description = "HTTP API for RepoLume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]